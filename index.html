<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPSTech Image-to-3D Studio</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 { color: #ff4747; margin-bottom: 5px; font-size: 20px; }
        p { color: #aaa; font-size: 13px; margin-bottom: 15px; }
        model-viewer {
            width: 100%;
            height: 250px;
            background: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .btn {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            display: inline-block;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2> ItachiGamedev AI Image-to-3D</h2>
    <p>Convert 2D art into free 3D models via Open-Source AI</p>
    
    <!-- 3D Interactive Viewer Component -->
    <model-viewer src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" alt="3D model preview" auto-rotate camera-controls></model-viewer>
    
    <br>
    <!-- Direct link to a free Hugging Face Space demo -->
    <a href="https://huggingface.co/spaces/stabilityai/TripoSR" target="_blank" class="btn">
        Open Free 3D Generator by JPSTech
    </a>
</div>

</body>
</html>
