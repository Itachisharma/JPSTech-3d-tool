<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPSTech Image-to-3D Studio</title>
    <style>
        body {
            background-color: #474c86;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            text-align: center;
            box-sizing: border-box;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            background: #eed0b3;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 { 
            color: #ff4747; 
            margin-bottom: 5px; 
            font-size: 18px; 
        }
        p { 
            color: #444; 
            font-size: 13px; 
            margin-bottom: 12px; 
            font-weight: 600; 
        }
        
        /* Responsive Embed Frame for Mobile & Desktop */
        .generator-frame {
            width: 100%;
            height: 480px;
            border: 2px solid #474c86;
            border-radius: 8px;
            background: #ffffff;
        }

        /* Mobile Optimization adjustments */
        @media screen and (max-width: 480px) {
            body {
                padding: 5px;
            }
            .container {
                padding: 10px;
                border-radius: 8px;
            }
            h2 {
                font-size: 16px;
            }
            p {
                font-size: 12px;
            }
            .generator-frame {
                height: 420px; /* Adjusts height so it fits nicely on phone screens */
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ItachiGamedev "AI Image-to-3D"</h2>
    <p>Upload your 2D art & generate/download 3D models directly:</p>
    
    <!-- Embedded Free Open-Source 3D Generator with Mobile Support -->
    <iframe src="https://stabilityai-triposr.hf.space" class="generator-frame" frameborder="0"></iframe>
</div>

</body>
</html>
